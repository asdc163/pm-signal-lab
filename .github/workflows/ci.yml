name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify built hosted surface
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4179 > "$RUNNER_TEMP/pm-signal-lab-preview.log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4179/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/pm-signal-lab-preview.log"
              exit 1
            fi
            sleep 1
          done

          HOSTED_URL=http://127.0.0.1:4179/ npm run verify:hosted
